<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El Hola Mundo definitivo en HTML5">
  <title>¡Hola, Mundo!</title>
  
  <style>

    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }


    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f8fafc;
        --text-color: #0f172a;
        --accent-color: #0284c7;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-stack);
      text-align: center;
      padding: 1.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .accent {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <main>
    <h1>¡Hola, <span class="accent">Mundo</span>!</h1>
  </main>

</body>
</html>
